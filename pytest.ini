# Pytest Configuration for Internship Hub API

[pytest]
# Test discovery
testpaths = QA
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication related tests
    api: API endpoint tests
    database: Database related tests
    slow: Slow running tests

# Minimum version
minversion = 6.0

# Coverage settings (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term-missing